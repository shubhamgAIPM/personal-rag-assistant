name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Offline unit tests only. The database and live-function tests need secrets
      # and test accounts, so they are run by hand (see README).
      - name: Unit tests
        run: node scripts/test-answer-logic.mjs

      - name: Check frontend settings are present
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Repository variable VITE_SUPABASE_URL is not set"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Repository variable VITE_SUPABASE_ANON_KEY is not set"; exit 1; }

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /personal-rag-assistant/
          # These are public by design (the publishable key is safe in the browser when RLS is on),
          # so they are repository variables, not secrets. Never put a service-role key here.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
